<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>All Notepad Pro</title>
    
    <style>
        :root {
            --primary-color: #7B5B3A; --bg-color: #F5F0D6; --text-color: #2C2520;
            --card-bg: #FFFDF5; --sidebar-bg: #241C15; --sidebar-header: #63472B;
            --sidebar-text: #F5F0D6; --border-color: #D8CEB2; --fab-color: #C0392B;
        }
        [data-theme="dark"] {
            --primary-color: #1F1B18; --bg-color: #121212; --text-color: #E8E6E3;
            --card-bg: #1E1E1E; --sidebar-bg: #0D0D0D; --sidebar-header: #1F1B18;
            --sidebar-text: #FFFFFF; --border-color: #333333; --fab-color: #E74C3C;
        }
        [data-theme="ocean"] {
            --primary-color: #1B4F72; --bg-color: #EBF5FB; --text-color: #154360;
            --card-bg: #FFFFFF; --sidebar-bg: #0E2A3D; --sidebar-header: #1B4F72;
            --sidebar-text: #EBF5FB; --border-color: #AED6F1; --fab-color: #2980B9;
        }
        [data-theme="purple"] {
            --primary-color: #512E5F; --bg-color: #F5EEF8; --text-color: #2A1435;
            --card-bg: #FFFFFF; --sidebar-bg: #1A0F21; --sidebar-header: #512E5F;
            --sidebar-text: #F5EEF8; --border-color: #E8DAEF; --fab-color: #8E44AD;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            margin: 0; padding: 0; background-color: var(--bg-color); color: var(--text-color);
            overflow-x: hidden; transition: background-color .3s, color .3s;
            padding-bottom: 60px; /* Space for Banner Ad */
        }

        header {
            background-color: var(--primary-color); color: #fff;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 20px 16px;
            display: flex; align-items: center; justify-content: space-between;
            position: sticky; top: 0; z-index: 20;
        }
        .header-left { display: flex; align-items: center; gap: 16px; }
        .menu-btn { font-size: 26px; cursor: pointer; background: transparent; border: none; color: #fff; }
        header h1 { margin: 0; font-size: 20px; font-weight: 600; }

        .side-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.5); z-index: 90; }
        .side-menu {
            height: 100%; width: 0; position: fixed; z-index: 100; top: 0; left: 0;
            background-color: var(--sidebar-bg); overflow-x: hidden; transition: width .3s;
            display: flex; flex-direction: column;
        }
        .menu-header { background-color: var(--sidebar-header); padding: 40px 20px 20px; color: #fff; position: relative; }
        .menu-header h2 { margin: 0 0 6px; font-size: 21px; }
        .close-btn { position: absolute; top: 15px; right: 15px; font-size: 28px; color: #fff; background: none; border: none; cursor: pointer; }
        .menu-links { padding: 10px 0; flex: 1; }
        .side-menu a {
            padding: 15px 22px; text-decoration: none; font-size: 16px; color: var(--sidebar-text);
            display: flex; align-items: center; gap: 14px; border-bottom: 1px solid rgba(255,255,255,.06); cursor: pointer;
        }

        #app, #editor-view { padding: 15px; max-width: 100%; margin: 0 auto; box-sizing: border-box; overflow: hidden; }
        .search-wrap { margin-bottom: 15px; }
        .search-bar {
            width: 100%; padding: 12px 15px 12px 40px; font-size: 15px;
            border: 1px solid var(--border-color); border-radius: 8px;
            background-color: var(--card-bg); color: var(--text-color); box-sizing: border-box;
        }

        /* FIXED DESIGN ISSUE (TEXT CUTTING & OVERFLOW) */
        .notes-grid { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .note-card {
            background-color: var(--card-bg); border: 1px solid var(--border-color);
            padding: 15px; border-radius: 10px; cursor: pointer;
            width: 100%; box-sizing: border-box; overflow: hidden; position: relative;
        }
        .note-card h3 { margin: 0 0 8px; font-size: 17px; word-break: break-word; }
        .note-card p {
            margin: 0; opacity: .75; font-size: 14px;
            word-break: break-word; overflow-wrap: anywhere; /* Fixes URLs */
            white-space: pre-wrap; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        .fab {
            position: fixed; bottom: 70px; right: 20px; background-color: var(--fab-color);
            color: #fff; width: 55px; height: 55px; border-radius: 50%;
            display: flex; justify-content: center; align-items: center; font-size: 28px;
            border: none; cursor: pointer; z-index: 40; box-shadow: 0 4px 10px rgba(0,0,0,.3);
        }

        /* FIXED BANNER AD SPACE FOR APP BUILDER */
        .admob-banner-container {
            position: fixed; bottom: 0; left: 0; width: 100%; height: 50px;
            background-color: transparent; z-index: 50; display: flex; justify-content: center; align-items: center;
        }

        .theme-card { display: none; background: var(--card-bg); padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border-color); }
        .theme-select { width: 100%; padding: 10px; margin-bottom: 10px; border-radius: 5px; }
        .theme-save-btn { width: 100%; padding: 12px; background: var(--primary-color); color: #fff; border: none; border-radius: 5px; cursor: pointer; }
        
        .title-input, .body-input { width: 100%; padding: 12px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; background: var(--card-bg); color: var(--text-color); box-sizing: border-box; }
        .body-input { height: 45vh; resize: none; }
        .editor-actions { display: flex; gap: 10px; }
        .btn { flex: 1; padding: 12px; border: none; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; }
        .btn-save { background: var(--primary-color); } .btn-delete { background: #C0392B; } .btn-cancel { background: #6C7A89; }
        .empty-state { text-align: center; padding: 40px 10px; opacity: 0.7; }
    </style>
</head>
<body>

    <div id="sideOverlay" class="side-overlay" onclick="closeNav()"></div>
    <div id="mySidenav" class="side-menu">
        <div class="menu-header">
            <button class="close-btn" onclick="closeNav()">&times;</button>
            <h2>All Notepad Pro</h2><p>Developer: Naveed Ali</p>
        </div>
        <div class="menu-links">
            <a onclick="showView('list')">🏠 Home (Notes)</a>
            <a onclick="openThemes()">🎨 Arts & Themes</a>
        </div>
    </div>

    <header>
        <div class="header-left">
            <button class="menu-btn" onclick="openNav()">&#9776;</button>
            <h1 id="header-title">All Notepad Pro</h1>
        </div>
    </header>

    <div id="app">
        <div class="search-wrap">
            <input type="text" class="search-bar" id="searchBar" placeholder="Search notes..." onkeyup="filterNotes()">
        </div>

        <div id="themeCard" class="theme-card">
            <h3>🎨 Select Theme</h3>
            <select id="themeSelect" class="theme-select" onchange="previewTheme()">
                <option value="light">Light Mode (Default)</option>
                <option value="dark">Dark Night</option>
                <option value="ocean">Ocean Blue</option>
                <option value="purple">Orchid Purple</option>
            </select>
            <button class="theme-save-btn" onclick="saveTheme()">💾 Save Theme & Trigger Ad</button>
        </div>

        <div id="notesContainer" class="notes-grid"></div>
        
        <div id="emptyState" class="empty-state">
            <h2>No Notes Found</h2><p>Tap + to create a secure note.</p>
        </div>

        <button class="fab" id="fabBtn" onclick="openEditor()">+</button>
    </div>
        <div id="editor-view" style="display:none;">
        <input type="hidden" id="editIndex" value="-1">
        <input type="text" id="noteTitle" class="title-input" placeholder="Note Title...">
        <textarea id="noteBody" class="body-input" placeholder="Write your secure note here..."></textarea>
        <div class="editor-actions">
            <button class="btn btn-cancel" onclick="showView('list')">Cancel</button>
            <button class="btn btn-delete" id="deleteBtn" onclick="deleteCurrentNote()" style="display:none">Delete</button>
            <button class="btn btn-save" onclick="saveNote()">Save Note</button>
        </div>
    </div>

    <!-- THIS IS WHERE THE APP BUILDER WILL INJECT THE NATIVE ADMOB BANNER -->
    <div class="admob-banner-container" id="adContainer"></div>

    <script>
        let notesData = [];
        const appView = document.getElementById('app');
        const editorView = document.getElementById('editor-view');
        const headerTitle = document.getElementById('header-title');
        const fabBtn = document.getElementById('fabBtn');

        // ADMOB INTERSTITIAL TRICK FUNCTION (Calls App Builder SDK)
        function triggerAppBuilderAd() {
            try {
                if (typeof AppCreator24 !== 'undefined') { AppCreator24.showInterstitial(); }
                else if (typeof Android !== 'undefined' && Android.showInterstitial) { Android.showInterstitial(); }
                else { console.log("Ad Triggered: Waiting for App Builder APK Environment."); }
            } catch (e) { console.log("Ad Error: ", e); }
        }

        function openNav() { document.getElementById("mySidenav").style.width = "260px"; document.getElementById("sideOverlay").style.display = "block"; }
        function closeNav() { document.getElementById("mySidenav").style.width = "0"; document.getElementById("sideOverlay").style.display = "none"; }
        
        function showView(view) {
            closeNav();
            if (view === 'list') {
                appView.style.display = "block"; editorView.style.display = "none";
                headerTitle.innerText = "All Notepad Pro"; fabBtn.style.display = "flex";
                renderNotes();
            } else {
                appView.style.display = "none"; editorView.style.display = "block"; fabBtn.style.display = "none";
            }
        }

        function openThemes() {
            closeNav(); showView('list');
            const card = document.getElementById('themeCard');
            card.style.display = card.style.display === 'block' ? 'none' : 'block';
        }

        function applyTheme(theme) {
            if (!theme || theme === 'light') { document.body.removeAttribute('data-theme'); } 
            else { document.body.setAttribute('data-theme', theme); }
        }

        function previewTheme() { applyTheme(document.getElementById('themeSelect').value); }
        
        function saveTheme() {
            const val = document.getElementById('themeSelect').value;
            localStorage.setItem('notepad_theme', val);
            applyTheme(val);
            document.getElementById('themeCard').style.display = 'none';
            triggerAppBuilderAd(); // TRICK: Shows Ad when theme is saved
        }

        function loadNotes() {
            const stored = localStorage.getItem("all_notepad_pro_db");
            notesData = stored ? JSON.parse(stored) : [];
            renderNotes();
            const savedTheme = localStorage.getItem('notepad_theme') || 'light';
            applyTheme(savedTheme);
            document.getElementById('themeSelect').value = savedTheme;
        }

        // DIRECT HOME SCREEN DELETE FUNCTION (Stop Propagation prevents note from opening)
        function deleteNoteFromHome(idx, event) {
            event.stopPropagation(); 
            if (confirm("Are you sure you want to delete this note?")) {
                notesData.splice(idx, 1);
                localStorage.setItem("all_notepad_pro_db", JSON.stringify(notesData));
                renderNotes(document.getElementById('searchBar').value);
            }
        }

        function renderNotes(filter = "") {
            const container = document.getElementById('notesContainer');
            container.innerHTML = "";
            let list = notesData;
            if (filter) { list = notesData.filter(n => n.title.toLowerCase().includes(filter.toLowerCase()) || n.body.toLowerCase().includes(filter.toLowerCase())); }
            
            if (list.length === 0) { document.getElementById('emptyState').style.display = "block"; } 
            else {
                document.getElementById('emptyState').style.display = "none";
                list.forEach(note => {
                    const idx = notesData.findIndex(n => n.id === note.id);
                    const card = document.createElement('div');
                    card.className = "note-card";
                    card.onclick = () => editNote(idx);
                    
                    // UPDATED UI: Added Direct Delete (Trash) Icon on Home Screen Cards
                    card.innerHTML = `
                        <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                            <h3 style="margin:0 0 8px; font-size:17px; word-break:break-word; width:85%;">${note.title ? note.title.replace(/</g, "&lt;") : 'Untitled'}</h3>
                            <div onclick="deleteNoteFromHome(${idx}, event)" style="font-size:22px; color:#C0392B; padding:5px; cursor:pointer; line-height:1; margin-top:-5px; margin-right:-5px;" title="Delete Note">🗑️</div>
                        </div>
                        <p style="margin:0; opacity:.75; font-size:14px; word-break:break-word; overflow-wrap:anywhere; white-space:pre-wrap; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden;">${note.body ? note.body.replace(/</g, "&lt;") : ''}</p>
                    `;
                    container.appendChild(card);
                });
            }
        }

        function filterNotes() { renderNotes(document.getElementById('searchBar').value); }

        function openEditor() {
            document.getElementById('editIndex').value = "-1";
            document.getElementById('noteTitle').value = ""; document.getElementById('noteBody').value = "";
            document.getElementById('deleteBtn').style.display = "none";
            headerTitle.innerText = "New Note"; showView('editor');
        }

        function editNote(idx) {
            const n = notesData[idx];
            document.getElementById('editIndex').value = idx;
            document.getElementById('noteTitle').value = n.title; document.getElementById('noteBody').value = n.body;
            document.getElementById('deleteBtn').style.display = "block";
            headerTitle.innerText = "Edit Note"; showView('editor');
        }

        function saveNote() {
            const title = document.getElementById('noteTitle').value.trim();
            const body = document.getElementById('noteBody').value.trim();
            const idx = parseInt(document.getElementById('editIndex').value);
            if (!title && !body) return;

            if (idx === -1) { notesData.unshift({ id: Date.now().toString(), title, body }); } 
            else { notesData[idx].title = title; notesData[idx].body = body; const item = notesData.splice(idx, 1)[0]; notesData.unshift(item); }
            
            localStorage.setItem("all_notepad_pro_db", JSON.stringify(notesData));
            triggerAppBuilderAd(); // TRICK: Shows Ad when note is saved
            showView('list');
        }

        function deleteCurrentNote() {
            const idx = parseInt(document.getElementById('editIndex').value);
            if (idx > -1 && confirm("Delete note?")) {
                notesData.splice(idx, 1);
                localStorage.setItem("all_notepad_pro_db", JSON.stringify(notesData));
                showView('list');
            }
        }

        window.onload = loadNotes;
    </script>
</body>
</html>
